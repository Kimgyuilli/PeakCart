apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: peekcart
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: peekcart
spec:
  replicas: 1
  # 무중단 rollout — header-trust 전환/이미지 교체 시 가용 replica 유지(PR3c §8 롤아웃 계약)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: peekcart
    spec:
      # DB-per-service (구현 ② PR2): 각 서비스가 자기 스키마를 독립 Flyway 마이그레이션하므로
      # order-service readiness 게이트(전환기 initContainer)를 제거한다 — cross-service cold-start 순서 의존 소멸.
      # gateway 내부 토큰 **공개키** 마운트(ADR-0017 D3 · PR3d-b). 비밀이 아니라 ConfigMap 이며,
      # 이미지 베이크 대신 두는 이유는 회전 overlap 이 이미지 변경 없이 끝나야 하기 때문이다(P8).
      volumes:
        - name: internal-token-keys
          configMap:
            name: internal-token-keys
      containers:
        - name: payment-service
          image: ghcr.io/kimgyuilli/peekcart-payment-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-service-config
            - configMapRef:
                name: internal-token-binding
            - secretRef:
                name: payment-service-secret
          volumeMounts:
            - name: internal-token-keys
              mountPath: /etc/peekcart/internal-token-keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: peekcart
  labels:
    app: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
