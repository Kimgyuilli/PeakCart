name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: chmod +x gradlew

      - name: Install lint dependencies
        run: |
          python3 -m pip install --user pyyaml

      - name: Set up kubectl (for ServiceMonitor lint)
        uses: azure/setup-kubectl@v4

      - name: Install promtool (for PromQL syntax lint)
        # PR3c: observability-promql-lint 의 PromQL syntax 검증 정본(ADR-0015 D5-V6).
        # promtool 미설치 시 lint 가 exit 2 로 명확히 실패한다 — balance 검사로 대체 금지.
        run: |
          PROM_VERSION=3.12.0
          curl -fsSL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Run CI policy lints
        # PR3b: per-service k8s 매니페스트(5) 완성으로 IMAGE_CONTRACT_TRANSITION(SUSPENDED) 제거.
        # image-contract-lint 가 ci↔base↔gke 3-way 를 full 5/5 로 강제한다.
        # PR3c: observability-ssot/promql lint 재활성 — root 단일 yml 전제를 per-service ground truth
        # (5서비스 application.yml + k8s Service metadata.name)로 재작성 완료(ADR-0015).
        #
        # 구현 ③ PR3b: gateway base/gke 매니페스트 완성으로 IMAGE_CONTRACT_TRANSITION 제거 —
        # image-contract-lint 가 도메인 5 + 인프라 1 을 full 6/6 로 강제한다(PR3a 가 남긴 꼬리 종결).
        # gateway-exposure-lint: 렌더 산출에서 gateway 노출 계약(8080 단일·관리포트 미노출·ConfigMap 배선)
        # 을 검사한다 — kustomize 렌더는 이 위반들을 전부 성공으로 통과시킨다.
        # 구현 ③ PR3d-b: 비밀 계약이 "Secret 미주입(비밀 0)" → "승인된 CSI 마운트 정확히 1개" 로 바뀌었다
        # (gateway 가 내부 토큰 서명 개인키를 갖게 됨, ADR-0017 D2). k8s Secret 경유는 여전히 금지다.
        run: |
          bash scripts/kustomize-namespace-lint.sh
          bash scripts/image-contract-lint.sh
          bash scripts/gateway-exposure-lint.sh
          # 조작 입력 9종에서 실제로 실패하는지 — lint 자체가 vacuous-green 으로 썩는 것을 막는다.
          bash scripts/gateway-exposure-lint.sh --self-test
          # NetworkPolicy backend ingress 제한(PR3c) — 0개 선택·peer 누락·egress 혼입 차단.
          bash scripts/networkpolicy-contract-lint.sh
          bash scripts/networkpolicy-contract-lint.sh --self-test
          # 내부 토큰 키 도메인 분리(ADR-0017 D3) — Gateway 공개키가 User JWKS 설정에 섞이면 실패.
          # kid 가 아니라 SPKI fingerprint 로 비교해 "같은 키를 다른 kid 로" 우회를 막는다.
          bash scripts/internal-key-ownership-lint.sh
          bash scripts/internal-key-ownership-lint.sh --self-test
          # 개인키 소유 경계(ADR-0013 D2 · ADR-0017 D2) — 렌더된 **모든 Pod 생성 종류**에서
          # gateway/user 개인키가 서로의 워크로드나 제3의 Job/CronJob/DaemonSet/Pod 로 새지 않는지.
          # exposure-lint 가 gateway 한 워크로드의 표면을 보는 반면, 이건 반대로 "누가 그 키를
          # 가져갔나" 를 본다 — 검사 대상 집합이 다르다.
          bash scripts/workload-key-ownership-lint.sh
          bash scripts/workload-key-ownership-lint.sh --self-test
          # settings.gradle include ↔ Dockerfile COPY 정합 — 모듈 추가 시 COPY 누락으로
          # gradle 은 그린인데 이미지 빌드만 깨지는 실패를 build 잡에서 미리 잡는다(#80 회귀).
          bash scripts/dockerfile-module-sync-lint.sh
          bash scripts/dockerfile-module-sync-lint.sh --self-test
          # DLQ 원장은 DB-per-service 라 4개 DB 에 같은 테이블을 둔다(④-c-2a). 한 서비스에서만
          # 컬럼을 고치면 runbook 조회 절차가 그 서비스에서만 깨지고, 운영자가 그 DB 를 볼 때까지
          # 드러나지 않는다. UNIQUE 6컬럼과 식별자 NOT NULL 도 함께 강제한다 —
          # nullable 이면 MySQL UNIQUE 가 같은 poison record 를 여러 행으로 만든다.
          bash scripts/dead-letter-schema-parity-lint.sh
          bash scripts/dead-letter-schema-parity-lint.sh --self-test
          bash scripts/servicemonitor-selector-lint.sh
          bash scripts/observability-ssot-lint.sh
          bash scripts/observability-promql-lint.sh
          # 구현 ④-d-1 P5: 신규 메트릭 alert(compensation/dlq backlog)의 라벨 계약이
          # 조작 입력에서 실제로 실패하는지 6종 — alert 삭제·라벨 제거·서비스 집합 축소·
          # 메트릭 변조·prometheus entry 삭제·부정 matcher 로 서비스 제외.
          bash scripts/observability-promql-lint.sh --self-test
          # PR3c sweep — 단일 'peekcart' 관측성 식별자(application/service) 잔존 0 강제.
          # escaped-quote(JSON/embedded-yaml) + 형제 라벨(service) 양쪽 매치(PLAN-BLINDSPOTS B11).
          # uid/tags 의 peekcart-* 브랜드 문자열은 라벨 값(="peekcart")이 아니므로 매치 대상 외.
          if grep -rnE '(application|service)=\\?"peekcart"|application: ?peekcart|service: ?peekcart' k8s/monitoring scripts; then
            echo "::error::단일 'peekcart' 관측성 라벨 값 잔존 — per-service 로 전환 필요 (ADR-0015)"
            exit 1
          fi

      - run: ./gradlew build --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      # saga 계약 매트릭스 게이트 (계획 P11~P15).
      # **build 뒤**에 둔다 — JUnit XML 이 있어야 --jvm-evidence 가 대조할 것이 생긴다.
      # required-ID 정본은 lint 안에 있으므로 매트릭스에서 행을 지워도 통과하지 않는다(N4).
      - name: saga contract matrix gate (structure + jvm evidence)
        if: always()
        run: |
          bash scripts/saga-contract-matrix-lint.sh --structure
          bash scripts/saga-contract-matrix-lint.sh --self-test
          SAGA_COMMIT_SHA="${GITHUB_SHA}" bash scripts/saga-contract-matrix-lint.sh --jvm-evidence
          # 시나리오 실행 순서 계약 — 스택이 필요 없어 여기서 돈다(계획 P10).
          bash scripts/saga-e2e-smoke.sh --self-test
          # E2E 격리·구독 정본 계약 (스택 무관)
          bash scripts/e2e-network-contract-lint.sh --self-test
          bash scripts/kafka-subscription-contract-lint.sh --self-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          # 멀티모듈이라 루트 build/reports 만 올리면 **어느 모듈도** 담기지 않는다.
          path: |
            build/reports/
            */build/test-results/**
            */build/reports/**

  # [PR3a] 서비스별 이미지 — 단일 Dockerfile + ARG SERVICE 매트릭스.
  # build/smoke(PR+push, contents:read 만) 와 publish(main push 한정, packages:write) 를 **분리**한다.
  # 권한은 job 단위라, PR 의 build/smoke 가 write 토큰 범위에서 돌지 않게 하려면 job 을 나눠야 한다.
  # 중복 빌드 회피: build/smoke 가 smoke 통과한 *바로 그 이미지* 를 docker save → artifact 로 넘기고,
  # publish 가 load 후 push 한다(재빌드/divergence 없음).
  images:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 도메인 5서비스(ADR-0010 §5) + 인프라 게이트웨이 1 = 6 (구현 ③ PR3a).
        # 주의: image-contract-lint 의 matrix 추출은 연속된 '- item' 행만 읽는다 — 항목 사이에
        # 주석을 끼우면 그 뒤가 잘려 canonical 대조가 조용히 어긋난다.
        service:
          - notification-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }}:ci .

      - name: Health smoke
        run: bash scripts/docker-health-smoke.sh ${{ matrix.service }}:ci

      # push 는 publish 가 쓰고, PR 은 e2e 잡이 쓴다. **PR 에서도 saga 4개는 올려야 한다** —
      # 초안은 push 한정이라 PR 러너에 이미지가 하나도 없었다(④-d-1 계획 리뷰가 잡은 전제).
      # 두 조건을 한 식으로 합쳐 Save/Upload 가 어긋날 수 없게 한다.
      - name: Save image (publish 또는 e2e 소비용)
        if: github.event_name == 'push' || contains(fromJSON('["order-service","product-service","payment-service","notification-service"]'), matrix.service)
        run: docker save ${{ matrix.service }}:ci | gzip > image.tar.gz

      - name: Upload image artifact
        if: github.event_name == 'push' || contains(fromJSON('["order-service","product-service","payment-service","notification-service"]'), matrix.service)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image.tar.gz
          retention-days: 1
          # 조용한 빈 artifact 는 e2e 잡에서 '이미지 없음' 으로 뒤늦게 터진다.
          if-no-files-found: error

  # cross-service saga E2E (계획 P12·P16·P18·P19).
  # 시나리오 4종 + 음성 대조군을 **실제 스택**에서 돌리고 매트릭스와 대조한다.
  e2e:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # ⑤ 실행 예산 — 전체 상한. 인프라가 매달려도 러너를 오래 잡지 않는다.
    timeout-minutes: 45
    env:
      PEEKCART_IMAGE_TAG: ci
      E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_COMMIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Download saga service images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*-service
          path: /tmp/images

      - name: Load images
        run: |
          set -euo pipefail
          # saga 4개가 **정확히** 있어야 한다. 하나라도 없으면 compose 가 옛 이미지를 쓰거나
          # pull 을 시도해 무엇을 검증했는지 알 수 없게 된다.
          expected="notification-service order-service payment-service product-service"
          for svc in $expected; do
            f="/tmp/images/image-${svc}/image.tar.gz"
            [[ -f "$f" ]] || { echo "::error::${svc} 이미지 artifact 가 없다"; exit 1; }
            gunzip -c "$f" | docker load
          done
          loaded=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -c ':ci$' || true)
          echo "loaded ${loaded} images"
          for svc in $expected; do
            docker image inspect "${svc}:ci" >/dev/null \
              || { echo "::error::${svc}:ci 가 로드되지 않았다"; exit 1; }
          done

      - name: Build runner image
        run: docker compose -f docker-compose.e2e.yml -p e2e-${E2E_RUN_ID} build runner

      - name: 시나리오 4종
        run: bash scripts/saga-e2e-smoke.sh

      # 대조군은 **자기 run_id(=compose project)** 로 돈다. 같은 project 를 쓰면 앞 단계의
      # teardown 이 완전히 끝나야만 cold-start volume 가드를 통과하는 순서 결합이 생긴다.
      # (증적 디렉터리 분리는 smoke 스크립트가 별도로 보장한다 — R2 #1)
      - name: 음성 대조군
        env:
          E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-nc
        run: bash scripts/saga-e2e-smoke.sh --negative-control

      - name: saga contract matrix gate (structure + e2e evidence)
        run: |
          bash scripts/saga-contract-matrix-lint.sh --structure
          SAGA_COMMIT_SHA="${GITHUB_SHA}" \
            bash scripts/saga-contract-matrix-lint.sh --e2e-evidence ".cache/e2e/${E2E_RUN_ID}"

      # ③ 실패해도 증적은 남긴다 — 실패한 실행의 로그가 가장 필요하다.
      - name: 증적 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}
          path: .cache/e2e/
          retention-days: 7

      - name: 스택 정리
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p "e2e-${E2E_RUN_ID}" \
            down -v --remove-orphans || true

  # GHCR publish — main push 한정. smoke 를 통과한 이미지를 load 후 push 한다.
  # packages:write 는 이 job 에만 부여되어 PR build/smoke 경로엔 write 토큰이 닿지 않는다.
  publish:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 도메인 5서비스(ADR-0010 §5) + 인프라 게이트웨이 1 = 6 (구현 ③ PR3a).
        # 주의: image-contract-lint 의 matrix 추출은 연속된 '- item' 행만 읽는다 — 항목 사이에
        # 주석을 끼우면 그 뒤가 잘려 canonical 대조가 조용히 어긋난다.
        service:
          - notification-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}

      - name: Load image
        run: docker load < <(gunzip -c image.tar.gz)

      - name: Resolve image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/peekcart-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        # L-016a/D-016: push 후 registry digest 를 산출하고, 비어 있으면 실패시킨다(digest 누락 green 차단).
        run: |
          IMG="${{ steps.img.outputs.name }}"
          docker tag ${{ matrix.service }}:ci "$IMG:${{ github.sha }}"
          docker tag ${{ matrix.service }}:ci "$IMG:latest"
          push_out="$(docker push "$IMG:${{ github.sha }}")"
          echo "$push_out"
          docker push "$IMG:latest"
          DIGEST="$(printf '%s\n' "$push_out" | grep -oE 'sha256:[0-9a-f]{64}' | head -1)"
          if [[ -z "$DIGEST" ]]; then
            echo "::error::[L-016a] ${IMG} push digest 산출 실패 — D-016 image promotion 계약 위반" >&2
            exit 1
          fi
          echo "pushed: ${IMG}@${DIGEST} (tags: ${{ github.sha }}, latest)"
          echo "pushed digest: $(docker inspect --format='{{index .RepoDigests 0}}' "$IMG:latest" 2>/dev/null || echo n/a)"
