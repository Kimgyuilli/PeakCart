spring:
  datasource:
    url: jdbc:mysql://mysql:3306/peekcart_user?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:peekcart_user}
    password: ${DB_PASSWORD:peekcart_user}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379

app:
  jwt:
    rs256:
      # 사용자 access token 서명 개인키의 **위치** (ADR-0013 D2 · 구현 ③ PR3d-b).
      # PR3c GKE 증적에서 ad-hoc k8s Secret 마운트였던 것을 Secret Manager CSI 로 정본화했다
      # (k8s/base/services/user-service/secretproviderclass.yml). 값이 아니라 경로만 설정에 둔다.
      private-key-location: file:/etc/peekcart/user-keys/jwt-private.pem

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.peekcart: INFO
