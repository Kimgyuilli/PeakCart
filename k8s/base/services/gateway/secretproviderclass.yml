# gateway 내부 토큰 서명 개인키 — GCP Secret Manager + Secrets Store CSI (ADR-0013 D2 · ADR-0017 D2)
#
# 왜 k8s Secret 이 아니라 CSI 인가:
#   k8s Secret 은 etcd 에 base64 로 저장될 뿐 암호화가 기본이 아니고, `kubectl get secret` 권한을
#   가진 누구나 개인키 원문을 얻는다. 내부 토큰 개인키는 이 클러스터의 *인증 신뢰 앵커* 라
#   (NetworkPolicy 우회 시 마지막 방어선, ADR-0017) 노출 시 전 서비스 위조가 가능하다.
#   CSI 는 Secret Manager 에서 노드 로컬 tmpfs 로 직접 투영하므로 etcd 를 경유하지 않는다.
#
# 계약 (scripts/gateway-exposure-lint.sh · scripts/internal-key-ownership-lint.sh 가 강제):
#   - 이 클러스터에서 승인된 gateway CSI 마운트는 **정확히 1개**다.
#   - `secretObjects` 금지 — 이를 쓰면 CSI 가 도로 k8s Secret 을 동기화 생성해 위 이점이 사라진다.
#   - `nodePublishSecretRef` 금지 — 노드 인증은 Workload Identity 로 한다(정적 자격증명 금지).
#   - parameters.secrets entry 는 정확히 1개(개인키 하나). 늘리려면 lint allow-list 를 함께 고쳐야 한다.
#
# PROJECT_ID_PLACEHOLDER 치환은 overlay/promote 절차와 동일하다(k8s/overlays/gke/kustomization.yml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-internal-signing-key
  namespace: peekcart
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: peekcart
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID_PLACEHOLDER/secrets/peekcart-gateway-internal-signing-key/versions/latest"
        path: "gateway-internal-private.pem"
