# cross-service saga E2E 스택 (계획 P3 · P4).
#
# 루트 docker-compose.yml 과 **별도 파일**이다. 그쪽은 개발 편의를 위해 container_name 과
# 호스트 포트를 고정하는데, 그러면 project 이름을 바꿔도 두 스택을 동시에 못 띄운다.
#
# 격리 계약 3가지:
#   1) container_name 없음 · 호스트 포트 미노출  → 같은 머신에서 project 여럿 병렬 기동 가능
#   2) 모든 서비스가 internal:true 네트워크 **하나에만** 부착 → 외부 egress 자체가 불가능
#      (N2 — "빈이 없어서 안 부른다" 가 아니라 네트워크 수준에서 막는다)
#   3) volume 은 매 실행 새로 만든다 → P4 가 run_id marker 로 판정
#
# 앱은 order/product/payment/notification 4개다. saga 체인에 참여하지 않는 user-service 와,
# HTTP 표면을 쓰지 않으므로 필요 없는 gateway 는 제외한다(계획 §9-6).

name: peekcart-e2e

x-app-env: &app-env
  # 프로파일은 local 을 쓰고 연결 정보만 환경변수로 덮는다 — 새 프로파일 yml 을 만들면
  # ADR-0007 이 금지하는 "환경 하나 늘 때마다 yml 하나" 가 된다.
  SPRING_PROFILES_ACTIVE: local
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # 전환기 평문 헤더 모드(ADR-0014 D2-c 이전부터 있던 운영 지원 모드).
  # runner 가 gateway 없이 실제 컨트롤러를 호출하기 위해서다 — E2E 를 위해 운영 코드에
  # 새 진입점이나 스위치를 만들지 않는다(N16). 대가는 SIGNED_ONLY 미검증(계획 §9-5).
  APP_INTERNAL_TOKEN_MODE: DUAL_ACCEPT
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"

x-app-common: &app-common
  networks: [internal]
  restart: "no"
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
    kafka: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 20s
  # 예산 (계획 P19) — 앱 하나가 러너 메모리를 다 먹으면 다른 앱이 OOM 으로 죽고
  # 그게 "시나리오 실패" 로 보인다. 원인을 분리하려면 상한이 필요하다.
  mem_limit: 768m

services:
  mysql:
    image: mysql:8.0
    networks: [internal]
    environment:
      MYSQL_ROOT_PASSWORD: root
      # P4 — init 단계에서 이 값이 marker 로 심긴다. readiness 가 현재 run_id 와 대조한다.
      E2E_RUN_ID: ${E2E_RUN_ID:?E2E_RUN_ID 를 지정해야 한다 (cold start 판정 입력)}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/e2e/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 1g

  redis:
    image: redis:7.2
    networks: [internal]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  kafka:
    image: apache/kafka:3.8.1
    networks: [internal]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # EXTERNAL 리스너 없음 — 호스트로 나가는 표면을 두지 않는다(격리 계약 2).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: peekcart-e2e-cluster-001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: 1g

  pg-stub:
    image: python:3.12-alpine
    networks: [internal]
    working_dir: /app
    command: ["python3", "stub.py"]
    volumes:
      - ./scripts/e2e/pg-stub:/app:ro
    environment:
      PG_STUB_PORT: "8080"
      PG_STUB_AMOUNT: "10000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/__health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  order-service:
    <<: *app-common
    image: order-service:${PEEKCART_IMAGE_TAG:-ci}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_order?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_order
      SPRING_DATASOURCE_PASSWORD: peekcart_order

  product-service:
    <<: *app-common
    image: product-service:${PEEKCART_IMAGE_TAG:-ci}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_product?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_product
      SPRING_DATASOURCE_PASSWORD: peekcart_product

  payment-service:
    <<: *app-common
    image: payment-service:${PEEKCART_IMAGE_TAG:-ci}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      pg-stub: {condition: service_healthy}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_payment?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_payment
      SPRING_DATASOURCE_PASSWORD: peekcart_payment
      # PG 표면은 끄지 않는다 — 환불 체인 전구간(dispatcher→PG→회신→종결)이 시나리오 C 의
      # 대상이기 때문이다. 대신 stub 으로 향하게 하고 네트워크로 외부를 막는다.
      TOSS_BASE_URL: http://pg-stub:8080/v1
      TOSS_SECRET_KEY: e2e_sk_stub
      APP_REFUND_DISPATCH_INTERVAL_MS: "2000"
      APP_REFUND_RECONCILE_INTERVAL_MS: "5000"

  notification-service:
    <<: *app-common
    image: notification-service:${PEEKCART_IMAGE_TAG:-ci}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_notification?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_notification
      SPRING_DATASOURCE_PASSWORD: peekcart_notification

  # 시나리오 실행자. internal 네트워크 안에서 돌아야 DB·Kafka·앱에 닿는다 —
  # 호스트에서 실행하면 격리 계약 2 를 깨야 하므로 러너를 안으로 넣는다.
  runner:
    image: peekcart-e2e-runner:${PEEKCART_IMAGE_TAG:-ci}
    build:
      context: ./scripts/e2e/runner
    networks: [internal]
    profiles: [tools]
    working_dir: /work
    volumes:
      - ./scripts/e2e:/work/e2e:ro
      - ./.cache/e2e:/work/out
    environment:
      E2E_RUN_ID: ${E2E_RUN_ID}
      E2E_COMMIT_SHA: ${E2E_COMMIT_SHA:-unknown}
    entrypoint: ["/bin/bash"]
    mem_limit: 512m

  # egress 차단의 **양성 대조군** (계획 P16 ⑥). internal 이 아닌 기본 네트워크에 붙는다 —
  # 같은 canary 주소에 이쪽은 닿고 앱 쪽은 못 닿아야 "격리가 실제로 걸렸다" 가 성립한다.
  # 실패만 보면 canary 가 죽어도 통과한다.
  egress-control:
    image: peekcart-e2e-runner:${PEEKCART_IMAGE_TAG:-ci}
    networks: [external-control]
    profiles: [control]
    entrypoint: ["/bin/bash"]
    mem_limit: 128m

networks:
  internal:
    internal: true
  external-control:
    internal: false

volumes:
  mysql-data:
  redis-data:
  kafka-data:
