spring:
  application:
    name: notification-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # DB-per-service (구현 ② PR2): 자기 스키마(peekcart_notification)에 자기 모듈 마이그레이션만 적용.
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: notification-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  # Gateway 서명 내부 토큰 검증 (ADR-0017 D3 · 구현 ③ PR3d).
  # 공개키는 비밀이 아니므로 이미지에 베이크한다(운영 kid 교체는 k8s ConfigMap — PR3d-b).
  # [중요] gateway kid 를 app.jwt.rs256.public-keys 에 넣지 않는다 — User JWKS 가 레지스트리를 전량
  # 게시하므로 내부 신뢰 앵커가 외부에 노출된다(ADR-0017 D3, internal-key-ownership-lint 로 강제).
  internal-token:
    mode: SIGNED_ONLY
    public-keys:
      - kid: peekcart-gateway-dev-2026
        location: classpath:keys/dev-gateway-internal-public.pem
  # processed_events 멱등성 보존 정책 (ADR-0012 D5 · 구현 ② PR3) — 동작 정책이므로 base 소유(ADR-0007).
  # notification 은 소비 전용(outbox 미소유) → outbox retention 없음.
  idempotency:
    retention: 7d          # floor 4창 max(=7d) 이상 — 미만이면 부팅 실패(fail-fast)
    floor:
      kafka-topic-retention: 7d
      max-consumer-downtime: 24h
      dlq-replay-window: 7d
      backfill-replay-window: 7d
    cleanup:
      batch-size: 500
      max-batches-per-run: 20

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/placeholder}
