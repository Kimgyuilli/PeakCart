# user-service 사용자 access token 서명 개인키 — GCP Secret Manager + Secrets Store CSI (ADR-0013 D2)
#
# PR3c GKE 증적(2026-08-08)에서 이 키는 ad-hoc k8s Secret 으로 마운트됐고, 그 편차가
# "PR3d P5 CSI 계약 미충족" 으로 기록됐다. 여기서 정본화해 잔여를 해소한다.
#
# gateway 개인키와 **키 도메인이 다르다**(ADR-0017 D3): 이 키는 외부 사용자 토큰 서명용이고
# 공개키는 JWKS 로 공개된다. gateway 내부 토큰 개인키는 외부에 존재를 드러내지 않는다.
# 두 키가 서로의 Pod 에 마운트되지 않음을 scripts/internal-key-ownership-lint.sh 가 전수 검사한다.
#
# 계약은 gateway SPC 와 동일: secretObjects·nodePublishSecretRef 금지, entry 정확히 1개, readOnly.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: user-service-jwt-signing-key
  namespace: peekcart
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: peekcart
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID_PLACEHOLDER/secrets/peekcart-user-jwt-signing-key/versions/latest"
        path: "jwt-private.pem"
