spring:
  application:
    name: user-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # DB-per-service (구현 ② PR2): 자기 스키마(peekcart_user)에 자기 모듈 마이그레이션만 적용.
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: user-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  jwt:
    # 발급(sign)·검증(common-auth verify) 동일 대칭키 단일 계약 (ADR-0014 D2-a)
    secret: ${JWT_SECRET:peekcart-secret-key-must-be-at-least-256-bits-long-xxxxxxxxxxxxxxx}
    access-token-expiry: 1800000    # 30분 (ms)
    refresh-token-expiry: 604800000 # 7일 (ms)
    # RS256 비대칭키 (ADR-0013 D1) — User 는 발급(개인키) owner. 로컬 dev 키는 classpath 기본,
    # k8s 는 Secret Manager 파일 마운트로 오버라이드(구현 ③ PR3). active-kid/fallback 은 동작 정책(ADR-0007 base).
    rs256:
      active-kid: peekcart-dev-2026
      # 전환기 HMAC(HS512) fallback 은 기본 비활성(RS256 단일). 전환 배포에서만 명시 활성화하고 PR4 에서 제거(bounded).
      hs256-fallback-enabled: false
      # 개인키는 산출물에 포함하지 않는다(ADR-0013 D2) — 로컬 dev 는 gitignored 파일 마운트, k8s 는 Secret Manager CSI(구현 ③ PR3).
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:./local-keys/dev-jwt-private.pem}
      public-keys:
        - kid: peekcart-dev-2026
          location: classpath:keys/dev-jwt-public.pem
# Slack: User 는 미사용. :common SlackNotificationClient 는 @ConditionalOnProperty(slack.webhook.url) 라
# 키 미선언 시 로드되지 않는다 (GW-2 P2 #1) — 더미 webhook 불필요.
